lesson-20:
  - char: 貸
    meaning_vi: [cho mượn, cho vay]
    han_viet: Thải
    mnemonic_vi: "Cho mượn (貸す) là hành động cho phép một người khác sử dụng một vật hoặc tài sản nào đó trong một khoảng thời gian nhất định và thường yêu cầu trả lại sau đó"
    components:
      - { char: 貝, meaning_en: shell/money, meaning_vi: vỏ sò/tiền, han_viet: Bối }
      - { char: 代, meaning_en: substitute, meaning_vi: thay thế, han_viet: Đại }
    related_vocab:
      - word: 貸す
        kana: かす
        han_viet: Thải
        meaning_vi: cho mượn (động từ)
        example:
          ja: 本を貸します。
          vi: Tôi cho mượn sách.
      - word: 貸家
        kana: かしや
        han_viet: Thải Gia
        meaning_vi: nhà cho thuê
        example:
          ja: 貸家を探しています。
          vi: Tôi đang tìm nhà cho thuê.
  - char: 借
