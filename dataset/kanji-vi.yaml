lesson-01:
  - char: 人
    meaning_vi: [người]
    han_viet: Nhân
    mnemonic_vi: "Người (人) đứng thẳng"
    components: null
    related_vocab:
      - word: あの人
        kana: あのひと
        han_viet: Nhân
        meaning_vi: người kia
        example:
          ja: あの人は誰ですか？
          vi: Người kia là ai?
      - word: アメリカ人
        kana: アメリカじん
        han_viet: Nhân
        meaning_vi: người Mỹ
        example:
          ja: 彼はアメリカ人です。
          vi: Anh ấy là người Mỹ.
      - word: 三人
        kana: さんにん
        han_viet: Tam Nhân
        meaning_vi: ba người
        example:
          ja: 部屋に三人います。
          vi: Trong phòng có ba người.
  - char: 名
    meaning_vi: [tên, danh]
    han_viet: Danh
    mnemonic_vi: "Người (人) có một cái miệng (口) để nói tên (名)"
    components: null
    related_vocab:
      - word: 名前
        kana: なまえ
        han_viet: Danh Tiền
        meaning_vi: tên, danh tính
        example:
          ja: お名前は何ですか？
          vi: Tên bạn là gì?
      - word: 有名
        kana: ゆうめい
        han_viet: Hữu Danh
        meaning_vi: nổi tiếng
        example:
          ja: 彼は有名な人です。
          vi: Anh ấy là người nổi tiếng.
      - word: 有名人
        kana: ゆうめいじん
        han_viet: Hữu Danh Nhân
        meaning_vi: người nổi tiếng
        example:
          ja: 彼女は有名人です。
          vi: Cô ấy là người nổi tiếng.
  - char: 方
    level: n5
    meaning_vi: [phương, hướng, cách]
    han_viet: Phương
    mnemonic_vi: "Người (人) chỉ về một hướng (方)"
    components: null
    related_vocab:
      - word: あの方
        kana: あのかた
        han_viet: Phương
        meaning_vi: người kia (lịch sự)
        example:
          ja: あの方は先生です。
          vi: Người kia là giáo viên.
      - word: 日本の方
        kana: にほんのかた
        han_viet: Nhật Bản Phương
        meaning_vi: người Nhật (lịch sự) (đất nước + の方)
        example:
          ja: 日本の方ですか？
          vi: Bạn là người Nhật à?
      - word: 方向
        kana: ほうこう
        han_viet: Phương Hướng
        meaning_vi: hướng, phương hướng
        example:
          ja: 方向がわかりません。
          vi: Tôi không biết hướng nào.
  - char: 本
    meaning_vi: [sách, gốc, cơ bản, Nhật Bản]
    han_viet: Bản
    mnemonic_vi: "Gốc cây (木) có thêm dấu gốc → bản gốc"
    components:
      - { char: 木, meaning_en: tree, meaning_vi: cây, han_viet: Mộc }
    related_vocab:
      - word: 山本
        kana: やまもと
        han_viet: Sơn Bản
        meaning_vi: tên người (Yamamoto)
        example:
          ja: 山本さんは日本人です。
          vi: Anh Yamamoto là người Nhật.
      - word: 本当
        kana: ほんとう
        han_viet: Bản Đương
        meaning_vi: sự thật, thật sự
        example:
          ja: これは本当ですか？
          vi: Đây có phải là sự thật không?
      - word: 三本
        kana: さんぼん
        han_viet: Tam Bản
        meaning_vi: ba cây (đếm vật dài)
        example:
          ja: 木が三本あります。
          vi: Có ba cây.
  - char: 日
    meaning_vi: [mặt trời, ngày]
    han_viet: Nhật
    mnemonic_vi: "Mặt trời (日) chiếu sáng"
    components: null
    related_vocab:
      - word: 先生の日
        kana: せんせいのひ
        han_viet: Tiên Sinh Nhật
        meaning_vi: ngày của thầy giáo
        example:
          ja: 先生の日はいつですか？
          vi: Ngày của thầy giáo là khi nào?
      - word: 二日
        kana: ふつか
        han_viet: Nhị Nhật
        meaning_vi: ngày mùng 2
        example:
          ja: 二日は何の日ですか？
          vi: Ngày mùng 2 là ngày gì?
      - word: 日本
        kana: にほん
        han_viet: Nhật Bản
        meaning_vi: Nhật Bản
        example:
          ja: 日本は美しい国です。
          vi: Nhật Bản là một đất nước đẹp.
      - word: 日曜日
        kana: にちようび
        han_viet: Nhật Diệu Nhật
        meaning_vi: chủ Nhật
        example:
          ja: 日曜日に映画を見ます。
          vi: Chủ Nhật tôi đi xem phim.
  - char: 何
    meaning_vi: [gì, cái gì]
    han_viet: Hà
    mnemonic_vi: "Cái gì (何) có một dấu hỏi ở trên"
    components:
      - { char: 亻, meaning_en: person, meaning_vi: người, han_viet: Nhân }
      - { char: 可, meaning_en: can, meaning_vi: có thể, han_viet: Khả }
    related_vocab:
      - word: 何語
        kana: なにご
        han_viet: Hà Ngữ
        meaning_vi: tiếng gì, ngôn ngữ gì
        example:
          ja: 何語を話せますか？
          vi: Bạn có thể nói tiếng gì?
      - word: 何をしますか
        kana: なにをしますか
        han_viet: Hà Sĩ
        meaning_vi: bạn làm gì, bạn sẽ làm gì
        example:
          ja: 何をしますか？
          vi: Bạn làm gì? / Bạn sẽ làm gì?
      - word: 何人
        kana: なんにん
        han_viet: Hà Nhân
        meaning_vi: mấy người, bao nhiêu người
        example:
          ja: 部屋に何人いますか？
          vi: Trong phòng có mấy người?
      - word: 何時
        kana: なんじ
        han_viet: Hà Thời
        meaning_vi: mấy giờ, khi nào
        example:
          ja: 今は何時ですか？
          vi: Bây giờ là mấy giờ?
      - word: 何日
        kana: なんにち
        han_viet: Hà Nhật
        meaning_vi: mấy ngày, ngày nào
        example:
          ja: 今日は何日ですか？
          vi: Hôm nay là ngày nào?
      - word: 何才
        kana: なんさい
        han_viet: Hà Tuế
        meaning_vi: mấy tuổi, bao nhiêu tuổi
        example:
          ja: お子さんは何才ですか？
          vi: Con bạn bao nhiêu tuổi?
  - char: 大
    meaning_vi: [lớn, to, đại]
    han_viet: Đại
    mnemonic_vi: "Người (大) giang tay to lớn"
    components:
      - { char: 人, meaning_en: person, meaning_vi: người, han_viet: Nhân }
    related_vocab:
      - word: 大きい
        kana: おおきい
        han_viet: Đại
        meaning_vi: to, lớn
        example:
          ja: 大きい犬がいます。
          vi: Có một con chó to.
      - word: 大雨
        kana: おおあめ
        han_viet: Đại Vũ
        meaning_vi: mưa lớn
        example:
          ja: 大雨が降っています。
          vi: Trời đang mưa lớn.
      - word: 大学
        kana: だいがく
        han_viet: Đại Học
        meaning_vi: đại học
        example:
          ja: 大学に行きます。
          vi: Tôi đi đại học.
      - word: 大会
        kana: たいかい
        han_viet: Đại Hội
        meaning_vi: đại hội, cuộc thi lớn
        example:
          ja: 大会に参加します。
          vi: Tôi sẽ tham gia đại hội.
  - char: 学
    meaning_vi: [học]
    han_viet: Học
    mnemonic_vi: "Học (学) có một mái nhà và một đứa trẻ bên dưới"
    components:
      - { char: 子, meaning_en: child, meaning_vi: đứa trẻ, han_viet: Tử }
      - { char: 龸, meaning_en: cover, meaning_vi: mái nhà, han_viet: Mịch }
    related_vocab:
      - word: 学生
        kana: がくせい
        han_viet: Học Sinh
        meaning_vi: học sinh, sinh viên
        example:
          ja: 私は学生です。
          vi: Tôi là học sinh/sinh viên.
      - word: 学校
        kana: がっこう
        han_viet: Học Hiệu
        meaning_vi: trường học
        example:
          ja: 学校に行きます。
          vi: Tôi đi học.
      - word: 学ぶ
        kana: まなぶ
        han_viet: Học
        meaning_vi: học, nghiên cứu (động từ)
        example:
          ja: 日本語を学びます。
          vi: Tôi học tiếng Nhật.

lesson-02:
  - char: 社
    meaning_vi: [xã, công ty, đền thờ]
    han_viet: Xã
    mnemonic_vi: "Người (人) làm việc trong một công ty (社)"
    components:
      - { char: 礻, meaning_en: spirit, meaning_vi: thần linh, han_viet: Thị }
      - { char: 土, meaning_en: earth, meaning_vi: đất, han_viet: Thổ }
    related_vocab:
      - word: 社長
        kana: しゃちょう
        han_viet: Xã Trưởng
        meaning_vi: giám đốc công ty
        example:
          ja: 彼は社長です。
          vi: Anh ấy là giám đốc công ty.
      - word: 神社
        kana: じんじゃ
        han_viet: Thần Xã
        meaning_vi: đền thờ thần linh
        example:
          ja: 神社に行きます。
          vi: Tôi đi đến đền thờ.
  - char: 員
    level: n5
    meaning_vi: [viên, nhân viên]
    han_viet: Viên
    mnemonic_vi: "Người (人) làm việc trong một công ty (社) là nhân viên (員)"
    components:
      - { char: 貝, meaning_en: shell, meaning_vi: vỏ sò, han_viet: Bối }
    related_vocab:
      - word: 社員
        kana: しゃいん
        han_viet: Xã Viên
        meaning_vi: nhân viên
        example:
          ja: 彼女は社員です。
          vi: Cô ấy là nhân viên.
      - word: 全員
        kana: ぜんいん
        han_viet: Toàn Viên
        meaning_vi: tất cả mọi người
        example:
          ja: 全員が集まりました。
          vi: Tất cả mọi người đã tập trung.
  - char: 会
    meaning_vi: [hội, gặp gỡ, công ty]
    han_viet: Hội
    mnemonic_vi: "Người (人) gặp nhau trong một hội nghị (会)"
    components:
      - { char: 人, meaning_en: person, meaning_vi: người, han_viet: Nhân }
      - { char: 云, meaning_en: say, meaning_vi: nói, han_viet: Vân }
    related_vocab:
      - word: 会います
        kana: あいます
        han_viet: Hội
        meaning_vi: gặp gỡ (động từ)
        example:
          ja: 友達に会います。
          vi: Tôi gặp bạn bè.
      - word: 会社
        kana: かいしゃ
        han_viet: Hội Xã
        meaning_vi: công ty
        example:
          ja: 会社に行きます。
          vi: Tôi đi làm ở công ty.
      - word: 社会
        kana: しゃかい
        han_viet: Xã Hội
        meaning_vi: xã hội
        example:
          ja: 社会について学びます。
          vi: Tôi học về xã hội.
      - word: 会員
        kana: かいいん
        han_viet: Hội Viên
        meaning_vi: hội viên, thành viên của một tổ chức
        example:
          ja: 私はそのクラブの会員です。
          vi: Tôi là hội viên của câu lạc bộ đó.
      - word: 会話
        kana: かいわ
        han_viet: Hội Thoại
        meaning_vi: hội thoại, cuộc trò chuyện
        example:
          ja: 日本語で会話します。
          vi: Tôi nói chuyện bằng tiếng Nhật.
  - char: 先
    meaning_vi: [trước, tiên, đầu tiên]
    han_viet: Tiên
    mnemonic_vi: "Người (人) đi trước là người tiên phong"
    components:
      - { char: 𠂉, meaning_en: lid, meaning_vi: nắp, han_viet: Cái }
      - { char: 儿, meaning_en: legs, meaning_vi: chân, han_viet: Nhân đi }
    related_vocab:
      - word: 先生
        kana: せんせい
        han_viet: Tiên Sinh
        meaning_vi: thầy giáo, cô giáo
        example:
          ja: 先生は優しいです。
          vi: Thầy cô giáo rất tốt bụng.
      - word: お先にしつれします。
        kana: おさきにしつれします。
        meaning_vi: Xin phép về trước.
        example:
          ja: お先にしつれします。
          vi: Xin phép về trước.
  - char: 生
    meaning_vi: [sinh, sống, đời sống]
    han_viet: Sinh
    mnemonic_vi: "Người (人) sinh ra từ đất (土)"
    components:
      - { char: 𠂉, meaning_en: lid, meaning_vi: nắp, han_viet: Cái }
    related_vocab:
      - word: 生まれる
        kana: うまれる
        meaning_vi: được sinh ra
        example:
          ja: 赤ちゃんが生まれました。
          vi: Em bé đã được sinh ra.
      - word: 学生
        kana: がくせい
        han_viet: Học Sinh
        meaning_vi: học sinh, sinh viên
        example:
          ja: 学生は勉強しています。
          vi: Học sinh đang học tập.
      - word: 先生
        kana: せんせい
        han_viet: Tiên Sinh
        meaning_vi: thầy giáo, cô giáo
        example:
          ja: 先生は優しいです。
          vi: Thầy cô giáo rất tốt bụng.
  - char: 行
    meaning_vi: [đi, hành, tiến hành]
    han_viet: Hành
    mnemonic_vi: "Người (人) đi trên đường (行) để hành động"
    components:
      - { char: 彳, meaning_en: step, meaning_vi: bước, han_viet: Xích }
      - { char: 一, meaning_en: one, meaning_vi: một, han_viet: Nhất }
      - { char: 丁, meaning_en: street, meaning_vi: phố, han_viet: Đinh }
    related_vocab:
      - word: 行く
        kana: いく
        han_viet: Hành
        meaning_vi: đi
        example:
          ja: 学校に行きます。
          vi: Tôi đi đến trường.
      - word: 銀行
        kana: ぎんこう
        han_viet: Ngân Hành
        meaning_vi: ngân hàng
        example:
          ja: 銀行へ行きます。
          vi: Tôi đi đến ngân hàng.
      - word: 銀行員
        kana: ぎんこういん
        han_viet: Ngân Hành Viên
        meaning_vi: nhân viên ngân hàng
        example:
          ja: 銀行員は親切です。
          vi: Nhân viên ngân hàng rất thân thiện.
  - char: 来
    meaning_vi: [đến, lai, tương lai]
    han_viet: Lai
    mnemonic_vi: "Người (人) đi đến một nơi mới (来)"
    components:
      - { char: 木, meaning_en: tree, meaning_vi: cây, han_viet: Mộc }
      - { char: 人, meaning_en: person, meaning_vi: người, han_viet: Nhân }
    related_vocab:
      - word: 来る
        kana: くる
        han_viet: Lai
        meaning_vi: đến
        example:
          ja: 明日来ます。
          vi: Tôi sẽ đến vào ngày mai.
      - word: 来週
        kana: らいしゅう
        han_viet: Lai Chu
        meaning_vi: tuần tới
        example:
          ja: 来週は忙しいです。
          vi: Tuần tới tôi bận rộn.
      - word: 来年
        kana: らいねん
        han_viet: Lai Niên
        meaning_vi: năm tới
        example:
          ja: 来年は旅行に行きたいです。
          vi: Năm tới tôi muốn đi du lịch.
      - word: 来月
        kana: らいげつ
        han_viet: Lai Nguyệt
        meaning_vi: tháng tới
