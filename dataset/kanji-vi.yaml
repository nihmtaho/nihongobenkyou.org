    han_viet: Quảng
    mnemonic_vi: "Rộng (広い) là khi một không gian có diện tích lớn hoặc có nhiều chỗ để di chuyển"
    components:
      - { char: 广, meaning_en: shelter, meaning_vi: mái che, han_viet: Nghiễm }
    related_vocab:
      - word: 広い
        kana: ひろい
        han_viet: Quảng
        meaning_vi: rộng (tính từ)
        example:
          ja: この部屋は広いです。
          vi: Căn phòng này rộng rãi.
      - word: 広場
        kana: ひろば
        han_viet: Quảng Trường
        meaning_vi: quảng trường
        example:
          ja: 公園の広場で遊びます。
          vi: Tôi chơi ở quảng trường trong công viên.
  - char: 止
    meaning_vi: [dừng, chỉ]
    han_viet: Chỉ
    mnemonic_vi: "Dừng (止まる) là khi một sự vật hoặc hành động ngừng lại hoặc không tiếp tục nữa"
    components:
      - { char: 止, meaning_en: stop, meaning_vi: dừng lại, han_viet: Chỉ }
    related_vocab:
      - word: 止まる
        kana: とまる
        han_viet: Chỉ
        meaning_vi: dừng lại, đỗ lại (động từ)
        example:
          ja: 車が止まります。
          vi: Xe dừng lại.
      - word: 止める
        kana: とめる
        han_viet: Chỉ
        meaning_vi: dừng, đỗ (động từ)
        example:
          ja: 車を止めます。
          vi: Tôi dừng xe.
      - word: 禁止
        kana: きんし
        han_viet: Cấm Chỉ
        meaning_vi: cấm, nghiêm cấm
        example:
          ja: ここは禁煙です。
          vi: Nơi này cấm hút thuốc.
      - word: 中止します
        kana: ちゅうしします
        han_viet: Trung Chỉ
        meaning_vi: hủy bỏ, ngừng lại (sự kiện hoặc hoạt động)
        example:
          ja: コンサートは中止します。
          vi: Buổi hòa nhạc đã bị hủy bỏ.
  - char: 雨
    meaning_vi: [mưa, vũ]
    han_viet: Vũ
    mnemonic_vi: "Mưa (雨) là hiện tượng khi nước rơi từ bầu trời xuống mặt đất"
    components:
      - { char: 雨, meaning_en: rain, meaning_vi: mưa, han_viet: Vũ }
    related_vocab:
      - word: 雨
        kana: あめ
        han_viet: Vũ
        meaning_vi: mưa
        example:
          ja: 雨が降っています。
          vi: Trời đang mưa.
      - word: 大雨
        kana: おおあめ
        han_viet: Đại Vũ
        meaning_vi: mưa lớn
        example:
          ja: 大雨が降っています。
          vi: Trời đang mưa rất to.
      - word: 小雨
        kana: こさめ
        han_viet: Tiểu Vũ
        meaning_vi: mưa nhỏ, mưa phùn
        example:
          ja: 小雨が降っています。
          vi: Trời đang mưa nhỏ.
  - char: 開
    meaning_vi: [mở, khai]
    han_viet: Khai
    mnemonic_vi: "Mở (開く) là hành động làm cho một vật gì đó không còn đóng hoặc bị che phủ nữa"
    components:
      - { char: 門, meaning_en: gate, meaning_vi: cổng, han_viet: Môn }
    related_vocab:
      - word: 開く
        kana: あく
        han_viet: Khai
        meaning_vi: mở ra (tự động từ, chỉ trạng thái cửa/hộp đã mở hoặc tự mở)
        example:
          ja: ドアが開いています。
          vi: Cửa đang mở.
      - word: 開ける
        kana: あける
        han_viet: Khai
        meaning_vi: mở (tha động từ, chủ động làm cho cái gì đó mở ra)
        example:
          ja: 窓を開けます。
          vi: Tôi mở cửa sổ.
      - word: 開く
        kana: ひらく
        han_viet: Khai
        meaning_vi: mở, mở ra (nghĩa rộng hơn, dùng cho việc mở ra (sách, tài khoản), tổ chức sự kiện, hoặc mở cánh hoa)
        example:
          ja: パーティーを開きます。
          vi: Tôi tổ chức một bữa tiệc.
      - word: 開花
        kana: かいか
        han_viet: Khai Hoa
        meaning_vi: việc ra hoa
        example:
          ja: 桜が開花しました。
          vi: Hoa anh đào đã nở.
  - char: 海
    meaning_vi: [biển, hải]
    han_viet: Hải
    mnemonic_vi: "Biển (海) là một vùng nước mặn lớn bao phủ phần lớn bề mặt Trái Đất và chứa đựng nhiều sinh vật biển"
    components:
      - { char: 毎, meaning_en: every, meaning_vi: mỗi, han_viet: Mỗi }
    related_vocab:
      - word: 海
        kana: うみ
        han_viet: Hải
        meaning_vi: biển
        example:
          ja: 海に行きます。
          vi: Tôi sẽ đi biển.
      - word: 日本海
        kana: にほんかい
        han_viet: Nhật Bản Hải
        meaning_vi: biển Nhật Bản
        example:
          ja: 日本海は美しいです。
          vi: Biển Nhật Bản rất đẹp.
      - word: 海外
        kana: かいがい
        han_viet: Hải Ngoại
        meaning_vi: nước ngoài
        example:
          ja: 海外に行きたいです。
          vi: Tôi muốn đi nước ngoài.
  - char: 川
    meaning_vi: [sông, xuyên]
    han_viet: Xuyên
    mnemonic_vi: "Sông (川) là một dòng nước tự nhiên chảy từ nơi cao xuống nơi thấp hơn và thường đổ ra biển hoặc hồ"
    components:
      - { char: 巛, meaning_en: river, meaning_vi: sông, han_viet: Xuyên }
    related_vocab:
      - word: 川
        kana: かわ
        han_viet: Xuyên
        meaning_vi: sông
        example:
          ja: 川で泳ぎます。
          vi: Tôi bơi ở sông.
      - word: 天の川
        kana: あまのがわ
        han_viet: Thiên Xuyên
        meaning_vi: dải ngân hà
        example:
          ja: 天の川は夜空に見えます。
          vi: Dải ngân hà có thể nhìn thấy trên bầu trời đêm.
      - word: ナイル川
        kana: ナイルがわ
        han_viet: Xuyên
        meaning_vi: sông Nile
        example:
          ja: ナイル川はアフリカにあります。
          vi: Sông Nile nằm ở châu Phi.

lesson-14:
  - char: 世
    meaning_vi: [thế, thế giới]
    han_viet: Thế
    mnemonic_vi: "Thế (世) là tất cả những gì tồn tại và xảy ra trên Trái Đất, bao gồm con người, động vật, thực vật và các hiện tượng tự nhiên"
    components:
      - { char: 一, meaning_en: one, meaning_vi: một, han_viet: Nhất }
      - { char: 廿, meaning_en: twenty, meaning_vi: hai mươi, han_viet: Nhập }
      - { char: 口, meaning_en: mouth, meaning_vi: miệng, han_viet: Khẩu }
    related_vocab:
      - word: 世界
        kana: せかい
        han_viet: Thế Giới
        meaning_vi: thế giới
        example:
          ja: 世界は広いです。
          vi: Thế giới rất rộng lớn.
      - word: 世紀
        kana: せいき
        han_viet: Thế Kỷ
        meaning_vi: thế kỷ
        example:
          ja: 20世紀は多くの変化がありました。
          vi: Thế kỷ 20 đã có nhiều thay đổi.
      - word: 世話します
        kana: せわします
        han_viet: Thế Thoại
        meaning_vi: chăm sóc, giúp đỡ (động từ)
        example:
          ja: 子供の世話をします。
          vi: Tôi chăm sóc trẻ em
  - char: 界
    meaning_vi: [giới, thế giới]
    han_viet: Giới
    mnemonic_vi: "Giới (界) là một phạm vi hoặc lĩnh vực mà trong đó các sự vật hoặc hiện tượng tồn tại và tương tác với nhau"
    components:
      - { char: 田, meaning_en: rice field, meaning_vi: ruộng lúa, han_viet: Điền }
      - { char: 介, meaning_en: mediate, meaning_vi: trung gian, han_viet: Giới }
    related_vocab:
      - word: 世界
        kana: せかい
        han_viet: Thế Giới
        meaning_vi: thế giới
        example:
          ja: 世界は広いです。
          vi: Thế giới rất rộng lớn
  - char: 画
    meaning_vi: [họa, hội họa]
    han_viet: Họa, Hoạch
    mnemonic_vi: "Họa (画) là nghệ thuật tạo ra hình ảnh bằng cách sử dụng các công cụ như bút vẽ, màu sắc và giấy"
    components:
      - { char: 田, meaning_en: rice field, meaning_vi: ruộng lúa, han_viet: Điền }
      - { char: 一, meaning_en: one, meaning_vi: một, han_viet: Nhất }
    related_vocab:
      - word: 画家
        kana: がか
        han_viet: Họa Gia
        meaning_vi: họa sĩ
        example:
          ja: 彼は有名な画家です。
          vi: Anh ấy là một họa sĩ nổi tiếng.
      - word: 絵画
        kana: かいが
        han_viet: Hội Họa
        meaning_vi: tranh vẽ, hội họa
        example:
          ja: 美術館で絵画を見ます。
          vi: Tôi xem tranh tại bảo tàng mỹ thuật.
      - word: 計画
        kana: けいかく
        han_viet: Kế Họa
        meaning_vi: kế hoạch
        example:
          ja: 旅行の計画を立てます。
          vi: Tôi lập kế hoạch cho chuyến du lịch.
  - char: 映
    meaning_vi: [ánh, chiếu]
    han_viet: Ánh
    mnemonic_vi: "Ánh (映る) là khi một hình ảnh hoặc ánh sáng được phản chiếu hoặc chiếu lên một bề mặt nào đó"
    components:
      - { char: 日, meaning_en: sun/day, meaning_vi: mặt trời/ngày, han_viet: Nhật }
      - { char: 央, meaning_en: center, meaning_vi: trung tâm, han_viet: Ống }
    related_vocab:
      - word: 映画
        kana: えいが
        han_viet: Ánh Họa
        meaning_vi: phim ảnh, điện ảnh
        example:
          ja: 映画を見ます。
          vi: Tôi xem phim.
      - word: 上映
        kana: じょうえい
        han_viet: Thượng Ánh
        meaning_vi: chiếu phim
        example:
          ja: 映画が上映されます。
          vi: Phim sẽ được chiếu.
  - char: 花
    meaning_vi: [hoa, hoa]
    han_viet: Hoa
    mnemonic_vi: "Hoa (花) là phần của cây có màu sắc và mùi thơm, thường được coi là đẹp và được sử dụng để trang trí hoặc làm quà tặng"
    components:
      - { char: 艹, meaning_en: grass, meaning_vi: cỏ, han_viet: Thảo }
      - { char: 化, meaning_en: change, meaning_vi: biến hóa, han_viet: Hóa }
    related_vocab:
      - word: 花屋
        kana: はなや
        han_viet: Hoa Ốc
        meaning_vi: cửa hàng hoa
        example:
          ja: 花屋で花を買います。
          vi: Tôi mua hoa ở cửa hàng hoa.
      - word: 花火
        kana: はなび
        han_viet: Hoa Hỏa
        meaning_vi: pháo hoa
        example:
          ja: 夏祭りで花火を見ます。
          vi: Tôi xem pháo hoa tại lễ hội mùa hè.
      - word: お花見
        kana: おはなみ
        han_viet: Hoa Kiến
        meaning_vi: ngắm hoa (thường là hoa anh đào)
        example:
          ja: 春にお花見をします。
          vi: Tôi ngắm hoa vào mùa xuân.
  - char: 茶
    meaning_vi: [trà, trà]
    han_viet: Trà
    mnemonic_vi: "Trà (茶) là một loại đồ uống được làm từ lá của cây trà, thường được uống nóng hoặc lạnh và có nhiều hương vị khác nhau"
    components:
      - { char: 艹, meaning_en: grass, meaning_vi: cỏ, han_viet: Thảo }
      - { char: 人, meaning_en: person, meaning_vi: người, han_viet: Nhân }
    related_vocab:
      - word: お茶
        kana: おちゃ
        han_viet: Trà
        meaning_vi: trà (cách gọi lịch sự)
        example:
          ja: お茶を飲みます。
          vi: Tôi uống trà.
      - word: 茶色
        kana: ちゃいろ
        han_viet: Trà Sắc
        meaning_vi: màu nâu
        example:
          ja: 茶色の靴を買います。
          vi: Tôi mua đôi giày màu nâu.
      - word: 茶道
        kana: さどう
        han_viet: Trà Đạo
        meaning_vi: trà đạo, nghệ thuật pha trà
        example:
          ja: 茶道を習います。
          vi: Tôi học trà đạo.
  - char: 語
    meaning_vi: [ngữ, ngôn ngữ]
    han_viet: Ngữ
    mnemonic_vi: "Ngữ (言語) là hệ thống các ký hiệu và quy tắc được sử dụng để giao tiếp giữa con người"
    components:
      - { char: 言, meaning_en: say, meaning_vi: nói, han_viet: Ngôn }
