  - char: 強
    meaning_vi: [mạnh, cường]
    han_viet: Cường
    mnemonic_vi: "Mạnh (強い) là khi một người hoặc vật có sức mạnh, khả năng hoặc ảnh hưởng lớn hơn so với người hoặc vật khác"
