        kana: にほんご
        han_viet: Nhật Bản Ngữ
        meaning_vi: tiếng Nhật
        example:
          ja: 日本語を勉強します。
          vi: Tôi học tiếng Nhật.
      - word: 英語
        kana: えいご
        han_viet: Anh Ngữ
        meaning_vi: tiếng Anh
        example:
          ja: 英語が話せますか？
          vi: Bạn có thể nói tiếng Anh không?
      - word: 言語
        kana: げんご
        han_viet: Ngôn Ngữ
        meaning_vi: ngôn ngữ
        example:
          ja: 言語は文化の一部です。
          vi: Ngôn ngữ là một phần của văn hóa.
      - word: 言語学
        kana: げんごがく
        han_viet: Ngữ Ngôn Học
        meaning_vi: ngôn ngữ học
        example:
          ja: 言語学を専攻しています。
          vi: Tôi chuyên ngành ngôn ngữ học.
  - char: 英
    meaning_vi: [anh, anh hùng]
    han_viet: Anh
    mnemonic_vi: "Anh (英雄) là một người có những phẩm chất đặc biệt như dũng cảm, thông minh và có khả năng lãnh đạo, thường được ngưỡng mộ và tôn vinh"
    components:
      - { char: 艹, meaning_en: grass, meaning_vi: cỏ, han_viet: Thảo }
      - { char: 央, meaning_en: center, meaning_vi: trung tâm, han_viet: Ống }
    related_vocab:
      - word: 英語
        kana: えいご
        han_viet: Anh Ngữ
        meaning_vi: tiếng Anh
        example:
          ja: 英語が話せますか？
          vi: Bạn có thể nói tiếng Anh không?

lesson-15:
  - char: 体
    meaning_vi: [thể, cơ thể]
    han_viet: Thể
    mnemonic_vi: "Thể (体) là toàn bộ phần vật chất của một sinh vật sống, bao gồm xương, cơ bắp, da và các cơ quan nội tạng"
    components:
      - { char: 人, meaning_en: person, meaning_vi: người, han_viet: Nhân }
      - { char: 本, meaning_en: book/origin, meaning_vi: sách/gốc, han_viet: Bản }
    related_vocab:
      - word: 体
        kana: からだ
        han_viet: Thể
        meaning_vi: cơ thể
        example:
          ja: 健康な体が大切です。
          vi: Một cơ thể khỏe mạnh là quan trọng.
      - word: 全体
        kana: ぜんたい
        han_viet: Toàn Thể
        meaning_vi: toàn thể, toàn bộ
        example:
          ja: 全体のバランスが重要です。
          vi: Cân bằng toàn thể là quan trọng.
  - char: 足
    meaning_vi: [túc, chân]
    han_viet: Túc
    mnemonic_vi: "Chân (足) là phần của cơ thể con người hoặc động vật dùng để đi lại và đứng vững"
    components:
      - { char: 口, meaning_en: mouth, meaning_vi: miệng, han_viet: Khẩu }
    related_vocab:
      - word: 足
        kana: あし
        han_viet: Túc
        meaning_vi: chân
        example:
          ja: 足が痛いです。
          vi: Chân tôi đau.
      - word: 〜足
        kana: 〜そく
        han_viet: Túc
        meaning_vi: đôi (đơn vị đếm giày dép)
        example:
          ja: 靴を二足買います。
          vi: Tôi mua hai đôi giày.
  - char: 口
    meaning_vi: [khẩu, miệng]
    han_viet: Khẩu
    mnemonic_vi: "Miệng (口) là phần của khuôn mặt con người hoặc động vật dùng để ăn uống và nói chuyện"
    components:
      - { char: 口, meaning_en: mouth, meaning_vi: miệng, han_viet: Khẩu }
    related_vocab:
      - word: 口
        kana: くち
        han_viet: Khẩu
        meaning_vi: miệng
        example:
          ja: 口を開けてください。
          vi: Hãy mở miệng ra.
      - word: 人口
        kana: じんこう
        han_viet: Nhân Khẩu
        meaning_vi: dân số
        example:
          ja: 日本の人口は約1億2000万人です。
          vi: Dân số Nhật Bản khoảng 120 triệu người.
      - word: 出口
        kana: でぐち
        han_viet: Xuất Khẩu
        meaning_vi: lối ra, cửa ra
        example:
          ja: 出口はどこですか？
          vi: Lối ra ở đâu?
      - word: 入口
        kana: いりぐち
        han_viet: Nhập Khẩu
        meaning_vi: lối vào, cửa vào
        example:
          ja: 入口はどこですか？
          vi: Lối vào ở đâu?
  - char: 顔
    meaning_vi: [nhan, khuôn mặt]
    han_viet: Nhan
    mnemonic_vi: "Khuôn mặt (顔) là phần trước của đầu người hoặc động vật, bao gồm mắt, mũi, miệng và các đặc điểm khác dùng để nhận diện và thể hiện cảm xúc"
    components:
      - { char: 頁, meaning_en: page/head, meaning_vi: trang/đầu, han_viet: Hiệt }
    related_vocab:
      - word: 顔
        kana: かお
        han_viet: Nhan
        meaning_vi: khuôn mặt
        example:
          ja: 彼は笑顔が素敵です。
          vi: Anh ấy có nụ cười đẹp.
      - word: 笑顔
        kana: えがお
        han_viet: Tiếu Nhan
        meaning_vi: nụ cười
        example:
          ja: 笑顔は人を幸せにします。
          vi: Nụ cười làm cho mọi người hạnh phúc.
  - char: 耳
    meaning_vi: [nhĩ, tai]
    han_viet: Nhĩ
    mnemonic_vi: "Tai (耳) là cơ quan của cơ thể con người hoặc động vật dùng để nghe và duy trì thăng bằng"
